[package]
name = "iot_gateway"
version = "0.1.0"
edition = "2021"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
dbg_macro = "deny"
todo = "warn"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-modbus = { version = "0.17", features = ["tcp-server", "server"] }
rumqttd = "0.20"
rumqttc = "0.25"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
arc-swap = "1"
